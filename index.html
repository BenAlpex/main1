<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Portfolyo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- MOUSE GLOW -->
<div class="mouse-glow" id="glow"></div>

<!-- PARTICLES -->
<canvas id="particles"></canvas>

<!-- ===== HEADER ===== -->
<div class="header">
    <div class="logo">✦ @kullaniciadiniz ✦</div>
    <div class="subtitle">🚀 Dijital İçerik Üreticisi · Oyun & Teknoloji</div>
</div>

<!-- ===== MÜZİK BUTONU ===== -->
<button id="musicBtn" onclick="toggleMusic()">
    <span class="music-icon">♪</span>
</button>

<!-- ===== CARDS ===== -->
<div class="center-ui">
    <div class="cards">

        <!-- Discord -->
        <div class="card" onclick="go('https://discord.com/users/senin-id')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/discord.svg" alt="Discord">
            </div>
            <span>Discord</span>
        </div>

        <!-- TikTok -->
        <div class="card" onclick="go('https://tiktok.com/@senin-kullanici')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/tiktok.svg" alt="TikTok">
            </div>
            <span>TikTok</span>
        </div>

        <!-- Instagram -->
        <div class="card" onclick="go('https://instagram.com/senin-kullanici')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" alt="Instagram">
            </div>
            <span>Instagram</span>
        </div>

        <!-- YouTube -->
        <div class="card" onclick="go('https://youtube.com/@senin-kanal')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg" alt="YouTube">
            </div>
            <span>YouTube</span>
        </div>

        <!-- Steam - DÜZELTİLDİ -->
        <div class="card" onclick="go('https://steamcommunity.com/id/senin-id')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/steam.svg" alt="Steam">
            </div>
            <span>Steam</span>
        </div>

        <!-- Roblox - DÜZELTİLDİ -->
        <div class="card" onclick="go('https://roblox.com/users/senin-id')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/roblox.svg" alt="Roblox">
            </div>
            <span>Roblox</span>
        </div>

        <!-- Spotify -->
        <div class="card" onclick="go('https://open.spotify.com/user/senin-id')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/spotify.svg" alt="Spotify">
            </div>
            <span>Spotify</span>
        </div>

        <!-- GitHub -->
        <div class="card" onclick="go('https://github.com/senin-kullanici')">
            <div class="card-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg" alt="GitHub">
            </div>
            <span>GitHub</span>
        </div>

    </div>
</div>

<script src="bg.js"></script>
<script src="particles.js"></script>

<script>
function go(url) {
    window.open(url, "_blank");
}

// MÜZİK KONTROLÜ
let isMusicPlaying = false;
let audio = null;

function toggleMusic() {
    const btn = document.getElementById('musicBtn');
    const icon = btn.querySelector('.music-icon');

    if (!audio) {
        // Gerçek müzik eklemek için:
        // audio = new Audio('/assets/muzik.mp3');
        // audio.loop = true;
        // audio.volume = 0.2;

        isMusicPlaying = !isMusicPlaying;
        icon.textContent = isMusicPlaying ? '♫' : '♪';
        btn.classList.toggle('playing');
        return;
    }

    if (isMusicPlaying) {
        audio.pause();
        icon.textContent = '♪';
    } else {
        audio.play();
        icon.textContent = '♫';
    }
    isMusicPlaying = !isMusicPlaying;
    btn.classList.toggle('playing');
}

// 3D TİLT EFECT
document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("mousemove", e => {
        const r = card.getBoundingClientRect();
        const x = e.clientX - r.left - r.width / 2;
        const y = e.clientY - r.top - r.height / 2;
        card.style.transform = `
            rotateY(${x / 20}deg) 
            rotateX(${-y / 20}deg) 
            translateY(-8px) 
            scale(1.05)
        `;
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "translateY(0) scale(1)";
    });
});
</script>

</body>
</html>
