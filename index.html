<script src="bg.js"></script>
<script src="particles.js"></script>

<script>
function go(url) {
    window.open(url, "_blank");
}

// MÜZİK KONTROLÜ
let isMusicPlaying = false;
let audio = null;

function toggleMusic() {
    const btn = document.getElementById('musicBtn');
    const icon = btn.querySelector('.music-icon');

    if (!audio) {
        // Gerçek müzik eklemek için:
        // audio = new Audio('/assets/muzik.mp3');
        // audio.loop = true;
        // audio.volume = 0.2;

        isMusicPlaying = !isMusicPlaying;
        icon.textContent = isMusicPlaying ? '♫' : '♪';
        btn.classList.toggle('playing');
        return;
    }

    if (isMusicPlaying) {
        audio.pause();
        icon.textContent = '♪';
    } else {
        audio.play();
        icon.textContent = '♫';
    }
    isMusicPlaying = !isMusicPlaying;
    btn.classList.toggle('playing');
}

// 3D TİLT + HOVER RENK
document.querySelectorAll(".card").forEach(card => {
    const originalColor = card.dataset.color;
    const icon = card.querySelector('.card-icon img');
    
    // Mouse hareketi - 3D tilt
    card.addEventListener("mousemove", e => {
        const r = card.getBoundingClientRect();
        const x = e.clientX - r.left - r.width / 2;
        const y = e.clientY - r.top - r.height / 2;
        card.style.transform = `
            rotateY(${x / 20}deg) 
            rotateX(${-y / 20}deg) 
            translateY(-8px) 
            scale(1.05)
        `;
    });

    // Mouse hover - Logo rengi değişimi
    card.addEventListener("mouseenter", () => {
        if (icon) {
            icon.style.filter = `brightness(0) saturate(100%) invert(0%) sepia(100%) hue-rotate(0deg)`;
            // SVG renklendirme için özel filter
            icon.style.filter = `drop-shadow(0 0 0 ${originalColor})`;
            icon.style.color = originalColor;
            // SVG'yi renklendirmek için
            icon.style.filter = `invert(39%) sepia(89%) saturate(1000%) hue-rotate(${getHueRotation(originalColor)}deg) brightness(1.2)`;
        }
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "translateY(0) scale(1)";
        if (icon) {
            icon.style.filter = "none";
            icon.style.color = "#ffffff";
        }
    });
});

// Renk değerinden hue rotation hesaplama
function getHueRotation(hexColor) {
    // RGB'ye çevir
    const r = parseInt(hexColor.slice(1,3), 16);
    const g = parseInt(hexColor.slice(3,5), 16);
    const b = parseInt(hexColor.slice(5,7), 16);
    
    // HSL'ye çevir
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    let h = 0;
    
    if (max !== min) {
        const d = max - min;
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (2 + (b - r) / d);
        else h = (4 + (r - g) / d);
        h *= 60;
        if (h < 0) h += 360;
    }
    
    return h;
}
</script>

</body>
