<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Portfolyo</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- MOUSE GLOW -->
<div class="mouse-glow" id="glow"></div>

<!-- PARTICLES -->
<canvas id="particles"></canvas>

<!-- LOGO -->
<div class="logo">
  <h1>✦ @kullaniciadiniz ✦</h1>
  <div class="badge">⚡ Dijital Dünyada</div>
</div>

<!-- SUBTITLE -->
<div class="subtitle">
  <p>
    <span class="emoji">🚀</span> 
    İçerik Üreticisi · Oyun · Teknoloji 
    <span class="emoji">🎮</span>
  </p>
</div>

<!-- MÜZİK BUTONU -->
<button id="musicBtn" onclick="toggleMusic()">🎵</button>

<!-- CARDS -->
<div class="center-ui">
  <div class="cards">

    <div class="card" onclick="go('https://discord.com/users/senin-id')">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968968.png" alt="Discord">
      <span>Discord</span>
    </div>

    <div class="card" onclick="go('https://tiktok.com/@senin-kullanici')">
      <img src="https://cdn-icons-png.flaticon.com/512/3116/3116491.png" alt="TikTok">
      <span>TikTok</span>
    </div>

    <div class="card" onclick="go('https://instagram.com/senin-kullanici')">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384015.png" alt="Instagram">
      <span>Instagram</span>
    </div>

    <div class="card" onclick="go('https://youtube.com/@senin-kanal')">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384012.png" alt="YouTube">
      <span>YouTube</span>
    </div>

    <div class="card" onclick="go('https://steamcommunity.com/id/senin-id')">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111628.png" alt="Steam">
      <span>Steam</span>
    </div>

    <div class="card" onclick="go('https://roblox.com/users/senin-id')">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968979.png" alt="Roblox">
      <span>Roblox</span>
    </div>

    <div class="card" onclick="go('https://open.spotify.com/user/senin-id')">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111620.png" alt="Spotify">
      <span>Spotify</span>
    </div>

    <div class="card" onclick="go('https://github.com/senin-kullanici')">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub">
      <span>GitHub</span>
    </div>

  </div>
</div>

<script src="bg.js"></script>
<script src="particles.js"></script>

<script>
function go(url) {
  window.open(url, "_blank");
}

// MÜZİK KONTROLÜ
let isMusicPlaying = false;
let audio = null;

function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  
  if (!audio) {
    // Gerçek müzik eklemek için:
    // audio = new Audio('/assets/muzik.mp3');
    // audio.loop = true;
    // audio.volume = 0.3;
    
    btn.textContent = isMusicPlaying ? '🎵' : '🔊';
    isMusicPlaying = !isMusicPlaying;
    return;
  }
  
  if (isMusicPlaying) {
    audio.pause();
    btn.textContent = '🎵';
  } else {
    audio.play();
    btn.textContent = '🔊';
  }
  isMusicPlaying = !isMusicPlaying;
}

// 3D TİLT EFECT
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("mousemove", e => {
    const r = card.getBoundingClientRect();
    const x = e.clientX - r.left - r.width / 2;
    const y = e.clientY - r.top - r.height / 2;
    card.style.transform = `
      rotateY(${x / 15}deg) 
      rotateX(${-y / 15}deg) 
      translateY(-6px) 
      scale(1.03)
    `;
  });

  card.addEventListener("mouseleave", () => {
    card.style.transform = "translateY(0) scale(1)";
  });
});
</script>

</body>
</html>
