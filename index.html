<script src="bg.js"></script>
<script src="particles.js"></script>

<script>
function go(url) {
    window.open(url, "_blank");
}

// ===== MÜZİK KONTROLÜ =====
let isMusicPlaying = false;
let audio = null;

function toggleMusic() {
    const btn = document.getElementById('musicBtn');
    const playIcon = btn.querySelector('.music-icon:not(.mute)');
    const muteIcon = btn.querySelector('.music-icon.mute');
    
    if (!audio) {
        // Gerçek müzik eklemek için:
        // audio = new Audio('/assets/muzik.mp3');
        // audio.loop = true;
        // audio.volume = 0.2;
        
        isMusicPlaying = !isMusicPlaying;
        
        if (isMusicPlaying) {
            playIcon.style.display = 'none';
            muteIcon.style.display = 'block';
            btn.classList.add('playing');
        } else {
            playIcon.style.display = 'block';
            muteIcon.style.display = 'none';
            btn.classList.remove('playing');
        }
        return;
    }
    
    if (isMusicPlaying) {
        audio.pause();
        playIcon.style.display = 'block';
        muteIcon.style.display = 'none';
        btn.classList.remove('playing');
    } else {
        audio.play();
        playIcon.style.display = 'none';
        muteIcon.style.display = 'block';
        btn.classList.add('playing');
    }
    isMusicPlaying = !isMusicPlaying;
}

// ===== 3D TİLT + HOVER RENK =====
document.querySelectorAll(".card").forEach(card => {
    const originalColor = card.dataset.color;
    const icon = card.querySelector('.card-icon img');
    
    // Mouse hareketi - 3D tilt
    card.addEventListener("mousemove", e => {
        const r = card.getBoundingClientRect();
        const x = e.clientX - r.left - r.width / 2;
        const y = e.clientY - r.top - r.height / 2;
        card.style.transform = `
            rotateY(${x / 20}deg) 
            rotateX(${-y / 20}deg) 
            translateY(-8px) 
            scale(1.05)
        `;
    });

    // Mouse hover - Logo rengi değişimi
    card.addEventListener("mouseenter", () => {
        if (icon && originalColor) {
            icon.style.filter = `drop-shadow(0 0 0 ${originalColor})`;
            // Renkli hale getir
            icon.style.filter = `brightness(0) saturate(100%) invert(0%) sepia(100%) hue-rotate(0deg)`;
            // Özel renk uygula
            icon.style.color = originalColor;
            icon.style.filter = `drop-shadow(0 0 0 ${originalColor})`;
            // CSS filter ile renklendirme
            const tempDiv = document.createElement('div');
            tempDiv.style.color = originalColor;
            document.body.appendChild(tempDiv);
            const color = getComputedStyle(tempDiv).color;
            document.body.removeChild(tempDiv);
            
            // SVG'yi renklendir
            icon.style.filter = `brightness(0) saturate(100%) invert(0%) sepia(100%)`;
            icon.style.color = originalColor;
        }
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "translateY(0) scale(1)";
        if (icon) {
            icon.style.filter = "brightness(0) invert(1)";
            icon.style.color = "#ffffff";
        }
    });
});

// Renk değerinden hue rotation hesaplama (alternatif yöntem)
function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : null;
}
</script>
