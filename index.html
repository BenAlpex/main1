<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Dijital Portfolyo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="mouse-glow" id="glow"></div>

<!-- PARTICLES -->
<canvas id="particles"></canvas>
  
<!-- LOGO -->
<div class="logo">✦ @kullaniciadiniz ✦</div>

<!-- SUBTITLE -->
<div class="subtitle">
  <span>⚡ Dijital İçerik Üreticisi · Oyun & Teknoloji ⚡</span>
</div>

<!-- MÜZİK BUTONU -->
<button id="musicBtn" onclick="toggleMusic()">🔊</button>

<!-- CENTER UI -->
<div class="center-ui">
  <div class="cards">

    <!-- Discord -->
    <div class="card" onclick="go('https://discord.com/users/senin-id')">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/discordjs/discordjs-original.svg" 
           onerror="this.src='https://cdn-icons-png.flaticon.com/512/5968/5968968.png'">
      <span>Discord</span>
    </div>

    <!-- TikTok -->
    <div class="card" onclick="go('https://tiktok.com/@senin-kullanici')">
      <img src="https://cdn-icons-png.flaticon.com/512/3116/3116491.png">
      <span>TikTok</span>
    </div>

    <!-- Instagram -->
    <div class="card" onclick="go('https://instagram.com/senin-kullanici')">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384015.png">
      <span>Instagram</span>
    </div>

    <!-- YouTube -->
    <div class="card" onclick="go('https://youtube.com/@senin-kanal')">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384012.png">
      <span>YouTube</span>
    </div>

    <!-- Steam - DOĞRU LOGO -->
    <div class="card" onclick="go('https://steamcommunity.com/id/senin-id')">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/steam/steam-original.svg"
           onerror="this.src='https://cdn-icons-png.flaticon.com/512/2111/2111628.png'">
      <span>Steam</span>
    </div>

    <!-- Roblox -->
    <div class="card" onclick="go('https://roblox.com/users/senin-id')">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968979.png">
      <span>Roblox</span>
    </div>

    <!-- Spotify - DOĞRU LOGO -->
    <div class="card" onclick="go('https://open.spotify.com/user/senin-id')">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/spotify/spotify-original.svg"
           onerror="this.src='https://cdn-icons-png.flaticon.com/512/2111/2111620.png'">
      <span>Spotify</span>
    </div>

    <!-- GitHub -->
    <div class="card" onclick="go('https://github.com/senin-kullanici')">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg"
           onerror="this.src='https://cdn-icons-png.flaticon.com/512/733/733553.png'">
      <span>GitHub</span>
    </div>

  </div>
</div>

<script src="bg.js"></script>
<script src="particles.js"></script>
<script>
// Link açma
function go(url){ window.open(url,"_blank"); }

// Müzik kontrolü
let isMusicPlaying = false;
let audio = null;

function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  
  if (!audio) {
    // Gerçek müzik için:
    // audio = new Audio('/muzik.mp3');
    // audio.loop = true;
    // audio.volume = 0.5;
    
    // Demo
    btn.textContent = isMusicPlaying ? '🔊' : '🔇';
    isMusicPlaying = !isMusicPlaying;
    btn.style.transform = isMusicPlaying ? 'scale(1.1) rotate(90deg)' : '';
    return;
  }
  
  if (isMusicPlaying) {
    audio.pause();
    btn.textContent = '🔊';
  } else {
    audio.play();
    btn.textContent = '🔇';
  }
  isMusicPlaying = !isMusicPlaying;
  btn.style.transform = isMusicPlaying ? 'scale(1.1) rotate(90deg)' : '';
}

// 3D Tilt
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("mousemove", e => {
    const r = card.getBoundingClientRect();
    const x = e.clientX - r.left - r.width/2;
    const y = e.clientY - r.top - r.height/2;
    card.style.transform =
      `rotateY(${x/12}deg) rotateX(${-y/12}deg) translateY(-8px) scale(1.02)`;
  });

  card.addEventListener("mouseleave", () => {
    card.style.transform = "translateY(0) scale(1)";
  });
});

// Mousemove için glow takibi (bg.js zaten var)
</script>

</body>
</html>
